<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Estoque • MagnoDoces</title>
<link rel="stylesheet" href="style.css?v=30">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

<div class="sidebar">
    <h2 class="logo">MagnoDoces</h2>

    <a href="dashboard.html?v=30" class="item"><span class="material-icons">dashboard</span> Dashboard</a>
    <a href="estoque.html?v=30" class="item"><span class="material-icons">inventory_2</span> Estoque</a>
    <a href="pedidos.html?v=30" class="item"><span class="material-icons">shopping_cart</span> Pedidos</a>
    <a href="producao.html?v=30" class="item"><span class="material-icons">factory</span> Produção</a>
    <a href="financeiro.html?v=30" class="item"><span class="material-icons">attach_money</span> Financeiro</a>
    <a href="catalogo.html?v=30" class="item"><span class="material-icons">storefront</span> Catálogo</a>
    <a href="index.html?v=30" class="item logout"><span class="material-icons">logout</span> Sair</a>
</div>

<div class="content">
    <h1>Estoque</h1>

    <!-- CARDS DE RESUMO -->
    <div class="cards" id="cardsResumo">
        <div class="card">
            <span class="material-icons icon">inventory</span>
            <h3>Total de Itens</h3>
            <p><b id="totalItens">0</b></p>
        </div>

        <div class="card">
            <span class="material-icons icon">warning</span>
            <h3>Estoque Baixo</h3>
            <p><b id="estoqueBaixo">0</b></p>
        </div>

        <div class="card">
            <span class="material-icons icon">category</span>
            <h3>Categorias</h3>
            <p><b id="totalCategorias">0</b></p>
        </div>
    </div>

    <!-- BUSCA E FILTRO -->
    <div style="display:flex; gap:20px; margin:20px 0;">
        <input id="busca" placeholder="Buscar produto...">
        <select id="filtroCategoria">
            <option value="">Todas categorias</option>
        </select>
        <button onclick="window.location.href='estoque-novo.html?v=30'">
            <span class="material-icons" style="vertical-align:middle;">add_circle</span>
            Adicionar Item
        </button>
    </div>

    <!-- TABELA PREMIUM -->
    <div class="card" style="padding:0;">
        <table>
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Categoria</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listaEstoque"></tbody>
        </table>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase.js?v=30"></script>

<script>
auth.onAuthStateChanged(user => {
    if (!user) window.location.href = "index.html?v=30";
});

let dadosEstoque = [];

db.collection("estoque").onSnapshot(snapshot => {
    dadosEstoque = [];
    const lista = document.getElementById("listaEstoque");
    const filtroCategoria = document.getElementById("filtroCategoria");

    lista.innerHTML = "";
    filtroCategoria.innerHTML = '<option value="">Todas categorias</option>';

    let categorias = new Set();
    let baixo = 0;

    snapshot.forEach(doc => {
        const item = doc.data();
        item.id = doc.id;
        dadosEstoque.push(item);

        categorias.add(item.categoria);
        if (item.quantidade < 5) baixo++;
    });

    categorias.forEach(cat => {
        filtroCategoria.innerHTML += `<option value="${cat}">${cat}</option>`;
    });

    document.getElementById("totalItens").innerText = dadosEstoque.length;
    document.getElementById("estoqueBaixo").innerText = baixo;
    document.getElementById("totalCategorias").innerText = categorias.size;

    renderTabela();
});

function renderTabela() {
    const lista = document.getElementById("listaEstoque");
    const busca = document.getElementById("busca").value.toLowerCase();
    const filtro = document.getElementById("filtroCategoria").value;

    lista.innerHTML = "";

    dadosEstoque
        .filter(item => item.nome.toLowerCase().includes(busca))
        .filter(item => filtro === "" || item.categoria === filtro)
        .forEach(item => {
            const alerta = item.quantidade < 5 ? "style='background:#8EE5C233;'" : "";

            lista.innerHTML += `
                <tr ${alerta}>
                    <td>${item.nome}</td>
                    <td>${item.quantidade}</td>
                    <td><span class="badge">${item.categoria}</span></td>
                    <td>
                        <button onclick="editar('${item.id}')"><span class="material-icons">edit</span></button>
                        <button onclick="remover('${item.id}')"><span class="material-icons">delete</span></button>
                    </td>
                </tr>
            `;
        });
}

document.getElementById("busca").oninput = renderTabela;
document.getElementById("filtroCategoria").onchange = renderTabela;

function editar(id) {
    window.location.href = "estoque-novo.html?id=" + id;
}

function remover(id) {
    if (confirm("Excluir item?")) {
        db.collection("estoque").doc(id).delete();
    }
}
</script>

</body>
</html>
