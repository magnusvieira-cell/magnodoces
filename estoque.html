<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="style.css?v=120">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

<div class="sidebar">
    <h2 class="logo">MagnoDoces</h2>

    <a href="dashboard.html?v=120" class="item"><span class="material-icons">dashboard</span> Dashboard</a>
    <a href="estoque.html?v=120" class="item"><span class="material-icons">inventory_2</span> Estoque</a>
    <a href="ingrediente-novo.html?v=120" class="item"><span class="material-icons">add</span> Novo Ingrediente</a>
    <a href="produtos-finais.html?v=120" class="item"><span class="material-icons">cake</span> Produtos Finais</a>
    <a href="produto-final-novo.html?v=120" class="item"><span class="material-icons">add_circle</span> Novo Produto Final</a>
    <a href="pedido-novo.html?v=120" class="item"><span class="material-icons">shopping_cart</span> Novo Pedido</a>
    <a href="pedidos.html?v=120" class="item"><span class="material-icons">list_alt</span> Pedidos</a>
    <a href="producao.html?v=120" class="item"><span class="material-icons">factory</span> Produção</a>
    <a href="financeiro.html?v=120" class="item"><span class="material-icons">attach_money</span> Financeiro</a>
    <a href="catalogo.html?v=120" class="item"><span class="material-icons">storefront</span> Catálogo</a>
    <a href="index.html?v=120" class="item logout"><span class="material-icons">logout</span> Sair</a>
</div>

<div class="content">
    <h1>Estoque</h1>

    <button onclick="window.location.href='ingrediente-novo.html?v=120'">
        <span class="material-icons" style="vertical-align:middle;">add</span>
        Novo Ingrediente
    </button>

    <div id="listaEstoque" class="cards"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase.js?v=120"></script>

<script>
auth.onAuthStateChanged(user => {
    if (!user) window.location.href = "index.html?v=120";
});

db.collection("estoque").onSnapshot(snapshot => {
    const area = document.getElementById("listaEstoque");
    area.innerHTML = "";

    snapshot.forEach(doc => {
        const ing = doc.data();

        area.innerHTML += `
            <div class="card">
                <h3>${ing.nome}</h3>
                <p><b>Quantidade:</b> ${ing.quantidade} ${ing.medida}</p>
                <p><b>Custo por ${ing.medida}:</b> R$ ${ing.custo.toFixed(4)}</p>

                <button onclick="ajustar('${doc.id}', '${ing.nome}', '${ing.medida}', ${ing.quantidade})">
                    <span class="material-icons">edit</span> Ajustar Estoque
                </button>

                <button onclick="remover('${doc.id}')">
                    <span class="material-icons">delete</span> Excluir
                </button>
            </div>
        `;
    });
});

function ajustar(id, nome, medida, atual) {
    const novo = prompt(`Quantidade atual de ${nome} (${medida}):`, atual);

    if (novo === null || novo === "") return;

    db.collection("estoque").doc(id).update({
        quantidade: Number(novo)
    });
}

function remover(id) {
    if (confirm("Excluir ingrediente?")) {
        db.collection("estoque").doc(id).delete();
    }
}
</script>

</body>
</html>
