<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Estoque • MagnoDoces</title>
<link rel="stylesheet" href="style.css?v=20">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

<div class="sidebar">
    <h2 class="logo">MagnoDoces</h2>

    <a href="dashboard.html?v=20" class="item"><span class="material-icons">dashboard</span> Dashboard</a>
    <a href="estoque.html?v=20" class="item"><span class="material-icons">inventory_2</span> Estoque</a>
    <a href="pedidos.html?v=20" class="item"><span class="material-icons">shopping_cart</span> Pedidos</a>
    <a href="producao.html?v=20" class="item"><span class="material-icons">factory</span> Produção</a>
    <a href="financeiro.html?v=20" class="item"><span class="material-icons">attach_money</span> Financeiro</a>
    <a href="catalogo.html?v=20" class="item"><span class="material-icons">storefront</span> Catálogo</a>
    <a href="index.html?v=20" class="item logout"><span class="material-icons">logout</span> Sair</a>
</div>

<div class="content">
    <h1>Estoque</h1>

    <button onclick="window.location.href='estoque-novo.html?v=20'">Adicionar Item</button>

    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Categoria</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="listaEstoque"></tbody>
    </table>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase.js?v=20"></script>

<script>
auth.onAuthStateChanged(user => {
    if (!user) window.location.href = "index.html?v=20";
});

db.collection("estoque").onSnapshot(snapshot => {
    const lista = document.getElementById("listaEstoque");
    lista.innerHTML = "";

    snapshot.forEach(doc => {
        const item = doc.data();
        lista.innerHTML += `
            <tr>
                <td>${item.nome}</td>
                <td>${item.quantidade}</td>
                <td>${item.categoria}</td>
                <td>
                    <button onclick="editar('${doc.id}')">Editar</button>
                    <button onclick="remover('${doc.id}')">Excluir</button>
                </td>
            </tr>
        `;
    });
});

function editar(id) {
    window.location.href = "estoque-novo.html?id=" + id;
}

function remover(id) {
    if (confirm("Excluir item?")) {
        db.collection("estoque").doc(id).delete();
    }
}
</script>

</body>
</html>
