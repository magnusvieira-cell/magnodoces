<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Etiquetas - MagnoDoces</title>

    <style>
        body {
            font-family: Arial;
            background: #f7f7f7;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        #form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        select, input {
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #45a049;
        }

        /* Etiquetas */
        .etiqueta {
            width: 300px;
            padding: 15px;
            border: 1px solid #000;
            margin: 10px;
            background: white;
            border-radius: 8px;
            display: inline-block;
            vertical-align: top;
            font-size: 14px;
        }

        .etiqueta h3 {
            margin: 0;
            text-align: center;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .qr {
            text-align: center;
            margin-top: 10px;
        }

        @media print {
            #form, #printBtn {
                display: none;
            }
            body {
                background: white;
            }
        }
    </style>
</head>
<body>

<h1>Gerador de Etiquetas</h1>

<div id="form">
    <label>Selecione o produto:</label>
    <select id="produtoSelect"></select>

    <label>Quantidade de etiquetas:</label>
    <input type="number" id="quantidade" value="1" min="1">

    <button onclick="gerarEtiquetas()">Gerar Etiquetas</button>
</div>

<div id="etiquetas"></div>

<button id="printBtn" onclick="window.print()">Imprimir</button>

<script type="module">
import "./auth.js";
import { auth, db } from "./firebase.js";
import { 
    collection, getDocs, doc, getDoc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// PERMISSÃO
async function verificarPermissao() {
    const user = auth.currentUser;
    const userDoc = await getDoc(doc(db, "users", user.uid));

    if (userDoc.data().role !== "admin") {
        alert("Acesso negado!");
        window.location.href = "index.html";
    }
}

verificarPermissao();

// CARREGAR PRODUTOS (RECEITAS)
async function carregarProdutos() {
    const select = document.getElementById("produtoSelect");
    const snap = await getDocs(collection(db, "receitas"));

    snap.forEach(docItem => {
        const r = docItem.data();
        select.innerHTML += `<option value="${docItem.id}">${r.nome}</option>`;
    });
}

carregarProdutos();

// FORMATAR INGREDIENTES
function formatarIngredientes(lista) {
    if (!Array.isArray(lista)) return "N/A";

    return lista
        .map(i => {
            if (typeof i === "string") return i;
            if (i.nome) return i.nome;
            return JSON.stringify(i);
        })
        .join(", ");
}

// CALCULAR VALIDADE
function calcularValidade(produto) {
    if (!produto.validade) return "N/A";

    // validade em dias (número)
    if (typeof produto.validade === "number") {
        const hoje = new Date();
        hoje.setDate(hoje.getDate() + produto.validade);
        return hoje.toISOString().split("T")[0];
    }

    // validade como string
    if (typeof produto.validade === "string") {
        return produto.validade;
    }

    // validade como objeto
    if (produto.validade.dias) {
        const hoje = new Date();
        hoje.setDate(hoje.getDate() + produto.validade.dias);
        return hoje.toISOString().split("T")[0];
    }

    return "N/A";
}

// GERAR ETIQUETAS
window.gerarEtiquetas = async function() {
    const produtoId = document.getElementById("produtoSelect").value;
    const quantidade = Number(document.getElementById("quantidade").value);

    const produtoDoc = await getDoc(doc(db, "receitas", produtoId));
    const produto = produtoDoc.data();

    const etiquetasDiv = document.getElementById("etiquetas");
    etiquetasDiv.innerHTML = "";

    const lote = new Date().toISOString().split("T")[0];
    const validade = calcularValidade(produto);
    const peso = produto.peso || "N/A";
    const ingredientes = formatarIngredientes(produto.ingredientes);
    const codigo = produto.codigo || produtoId.substring(0, 6).toUpperCase();

    for (let i = 0; i < quantidade; i++) {
        etiquetasDiv.innerHTML += `
            <div class="etiqueta">
                <h3>MAGNODOCES</h3>
                <p><strong>Produto:</strong> ${produto.nome}</p>
                <p><strong>Lote:</strong> ${lote}</p>
                <p><strong>Validade:</strong> ${validade}</p>
                <p><strong>Peso:</strong> ${peso}</p>
                <p><strong>Ingredientes:</strong> ${ingredientes}</p>
                <p><strong>Código Interno:</strong> ${codigo}</p>

                <div class="qr">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(produto.nome)}">
                </div>
            </div>
        `;
    }
};
</script>

</body>
</html>
