<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Produção • MagnoDoces</title>
<link rel="stylesheet" href="style.css?v=20">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

<div class="sidebar">
    <h2 class="logo">MagnoDoces</h2>

    <a href="dashboard.html?v=20" class="item"><span class="material-icons">dashboard</span> Dashboard</a>
    <a href="estoque.html?v=20" class="item"><span class="material-icons">inventory_2</span> Estoque</a>
    <a href="pedidos.html?v=20" class="item"><span class="material-icons">shopping_cart</span> Pedidos</a>
    <a href="producao.html?v=20" class="item"><span class="material-icons">factory</span> Produção</a>
    <a href="financeiro.html?v=20" class="item"><span class="material-icons">attach_money</span> Financeiro</a>
    <a href="catalogo.html?v=20" class="item"><span class="material-icons">storefront</span> Catálogo</a>
    <a href="index.html?v=20" class="item logout"><span class="material-icons">logout</span> Sair</a>
</div>

<div class="content">
    <h1>Produção</h1>

    <div class="cards" id="cardsProducao"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase.js?v=20"></script>

<script>
auth.onAuthStateChanged(user => {
    if (!user) window.location.href = "index.html?v=20";
});

db.collection("producao").onSnapshot(snapshot => {
    const area = document.getElementById("cardsProducao");
    area.innerHTML = "";

    snapshot.forEach(doc => {
        const p = doc.data();
        area.innerHTML += `
            <div class="card">
                <span class="material-icons icon">cake</span>
                <h3>${p.produto}</h3>
                <p>Quantidade: <b>${p.quantidade}</b></p>
                <p>Status: <b>${p.status}</b></p>
                <button onclick="editar('${doc.id}')">Editar</button>
            </div>
        `;
    });
});

function editar(id) {
    window.location.href = "producao-novo.html?id=" + id;
}
</script>

</body>
</html>
