<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Catálogo • MagnoDoces</title>
<link rel="stylesheet" href="style.css">
<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
}
.header {
    background: #8B0000;
    color: #fff;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.header h1 {
    margin: 0;
    font-size: 22px;
}
.header button {
    background: #fff;
    color: #8B0000;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}
.catalogo {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    padding: 16px;
}
.card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}
.card-content {
    padding: 12px;
}
.card-title {
    font-weight: bold;
    margin-bottom: 4px;
}
.card-desc {
    font-size: 13px;
    color: #555;
    margin-bottom: 8px;
}
.card-price {
    font-size: 16px;
    font-weight: bold;
    color: #8B0000;
    margin-bottom: 10px;
}
.card button {
    width: 100%;
    padding: 10px;
    border: none;
    background: #8B0000;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    border-radius: 0 0 10px 10px;
}
</style>
</head>

<body>

<div class="header">
    <h1>Catálogo MagnoDoces</h1>
    <button onclick="irCarrinho()">Ver carrinho</button>
</div>

<div id="catalogo" class="catalogo"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
<script src="firebase.js"></script>

<script>
function irCarrinho() {
    window.location.href = "cliente-carrinho.html";
}

function carregarCatalogo() {
    db.collection("produtosFinais").get().then(snap => {
        const div = document.getElementById("catalogo");
        div.innerHTML = "";

        snap.forEach(doc => {
            const p = doc.data();
            const id = doc.id;

            const imagem = p.imagem || "https://via.placeholder.com/400x300?text=MagnoDoces";

            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <img src="${imagem}">
                <div class="card-content">
                    <div class="card-title">${p.nome}</div>
                    <div class="card-desc">${p.descricao || ""}</div>
                    <div class="card-price">R$ ${Number(p.preco).toFixed(2)}</div>
                </div>
                <button onclick="adicionarCarrinho('${id}', '${p.nome}', ${Number(p.preco)})">
                    Adicionar ao pedido
                </button>
            `;
            div.appendChild(card);
        });
    });
}

function adicionarCarrinho(id, nome, preco) {
    const carrinho = JSON.parse(localStorage.getItem("carrinho") || "[]");

    const existente = carrinho.find(i => i.id === id);
    if (existente) {
        existente.qtd += 1;
    } else {
        carrinho.push({ id, nome, preco, qtd: 1 });
    }

    localStorage.setItem("carrinho", JSON.stringify(carrinho));
    alert("Produto adicionado ao carrinho!");
}

carregarCatalogo();
</script>

</body>
</html>
