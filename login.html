<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • MagnoDoces</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #F7F9FA;
        }

        .login-card {
            background: #FFFFFF;
            width: 360px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            text-align: center;
            border-top: 6px solid #A8E6CF;
        }

        .login-card h2 {
            margin-bottom: 20px;
            font-size: 26px;
            font-weight: 700;
            color: #8B6F47;
        }

        .login-card p {
            margin-bottom: 25px;
            color: #8B6F47;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #D1D5DB;
            font-size: 15px;
            color: #8B6F47;
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            background: #A8E6CF;
            color: #8B6F47;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }

        .login-card button:hover {
            background: #B3CDE0;
        }

        .login-card small {
            display: block;
            margin-top: 15px;
            color: #8B6F47;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>MagnoDoces</h2>
        <p>Acesse sua conta para continuar</p>

        <input type="email" id="email" placeholder="Seu e-mail">
        <input type="password" id="senha" placeholder="Sua senha">

        <button onclick="login()">Entrar</button>

        <small>© 2026 MagnoDoces • Sistema de Gestão</small>
    </div>

    <script src="firebase.js"></script>
    <script src="auth.js"></script>

    <script>
        function login() {
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            firebase.auth().signInWithEmailAndPassword(email, senha)
                .then(() => {
                    window.location.href = "index.html";
                })
                .catch(error => {
                    alert("Erro ao entrar: " + error.message);
                });
        }
    </script>

</body>
</html>
