<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
        .card {
            display: inline-block;
            width: 22%;
            margin: 1%;
            padding: 20px;
            background: #f2f2f2;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
        }
        canvas {
            margin-top: 40px;
        }
    </style>
</head>
<body>

<h1>Dashboard Geral</h1>

<div class="card">
    <b>Total em Compras</b><br>
    R$ <span id="totalCompras">0.00</span>
</div>

<div class="card">
    <b>Total em Estoque</b><br>
    R$ <span id="totalEstoque">0.00</span>
</div>

<div class="card">
    <b>Total em Vendas</b><br>
    R$ <span id="totalVendas">0.00</span>
</div>

<div class="card">
    <b>Lucro Total</b><br>
    R$ <span id="lucroTotal">0.00</span>
</div>

<h2>Gráfico: Compras por Tipo</h2>
<canvas id="grafCompras"></canvas>

<h2>Gráfico: Vendas por Dia</h2>
<canvas id="grafVendas"></canvas>

<h2>Gráfico: Estoque Consolidado</h2>
<canvas id="grafEstoque"></canvas>

<script type="module">
import { db } from "./firebase.js";
import { 
    collection, getDocs 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// =========================
// CARREGAR DADOS
// =========================

async function carregarDashboard() {

    // -------- COMPRAS --------
    const comprasSnap = await getDocs(collection(db, "compras"));
    let totalCompras = 0;
    let comprasIngrediente = 0;
    let comprasMaterial = 0;

    comprasSnap.forEach(doc => {
        const c = doc.data();
        totalCompras += c.precoTotal;

        if (c.tipo === "ingrediente") comprasIngrediente += c.precoTotal;
        if (c.tipo === "material") comprasMaterial += c.precoTotal;
    });

    document.getElementById("totalCompras").innerText = totalCompras.toFixed(2);

    // -------- ESTOQUE --------
    const estoqueSnap = await getDocs(collection(db, "estoque"));
    let totalEstoque = 0;
    let estoqueMap = {};

    estoqueSnap.forEach(doc => {
        const e = doc.data();
        totalEstoque += e.custoTotal;

        if (!estoqueMap[e.nome]) estoqueMap[e.nome] = 0;
        estoqueMap[e.nome] += e.quantidade;
    });

    document.getElementById("totalEstoque").innerText = totalEstoque.toFixed(2);

    // -------- VENDAS --------
    const vendasSnap = await getDocs(collection(db, "vendas"));
    let totalVendas = 0;
    let lucroTotal = 0;

    let vendasPorDia = {};

    vendasSnap.forEach(doc => {
        const v = doc.data();
        totalVendas += v.precoVenda * v.quantidade;
        lucroTotal += v.lucroReal;

        if (!vendasPorDia[v.data]) vendasPorDia[v.data] = 0;
        vendasPorDia[v.data] += v.precoVenda * v.quantidade;
    });

    document.getElementById("totalVendas").innerText = totalVendas.toFixed(2);
    document.getElementById("lucroTotal").innerText = lucroTotal.toFixed(2);

    // =========================
    // GRÁFICO: COMPRAS POR TIPO
    // =========================

    new Chart(document.getElementById("grafCompras"), {
        type: "pie",
        data: {
            labels: ["Ingredientes", "Materiais"],
            datasets: [{
                data: [comprasIngrediente, comprasMaterial],
                backgroundColor: ["#4CAF50", "#2196F3"]
            }]
        }
    });

    // =========================
    // GRÁFICO: VENDAS POR DIA
    // =========================

    new Chart(document.getElementById("grafVendas"), {
        type: "bar",
        data: {
            labels: Object.keys(vendasPorDia),
            datasets: [{
                label: "Vendas (R$)",
                data: Object.values(vendasPorDia),
                backgroundColor: "#FF9800"
            }]
        }
    });

    // =========================
    // GRÁFICO: ESTOQUE CONSOLIDADO
    // =========================

    new Chart(document.getElementById("grafEstoque"), {
        type: "bar",
        data: {
            labels: Object.keys(estoqueMap),
            datasets: [{
                label: "Quantidade em Estoque",
                data: Object.values(estoqueMap),
                backgroundColor: "#9C27B0"
            }]
        }
    });
}

carregarDashboard();
</script>

</body>
</html>
