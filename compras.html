<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Compras</title>
</head>
<body>

<h2>Registrar Compras</h2>

<input id="item" placeholder="Item comprado"><br><br>
<input id="unidade" placeholder="Unidade (kg, g, ml, unidade)"><br><br>
<input id="quantidade" type="number" placeholder="Quantidade"><br><br>
<input id="precoIndividual" type="number" step="0.01" placeholder="Preço individual (R$)"><br><br>

<select id="tipo">
    <option value="ingrediente">Ingrediente</option>
    <option value="material">Material</option>
</select><br><br>

<button onclick="adicionarItem()">Adicionar Item à Lista</button>

<h3>Itens adicionados</h3>
<div id="listaItens"></div>

<br>
<button onclick="salvarTudo()">Salvar Todas as Compras</button>

<h2>Compras Registradas</h2>
<div id="lista"></div>

<script type="module">
import { db } from "./firebase.js";
import { 
    collection, addDoc, getDocs, deleteDoc, doc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let itens = [];

// ADICIONAR ITEM À LISTA TEMPORÁRIA
window.adicionarItem = function() {
    const item = document.getElementById("item").value;
    const unidade = document.getElementById("unidade").value;
    const quantidade = Number(document.getElementById("quantidade").value);
    const precoIndividual = Number(document.getElementById("precoIndividual").value);
    const tipo = document.getElementById("tipo").value;

    if (!item || !unidade || !quantidade || !precoIndividual) {
        alert("Preencha todos os campos!");
        return;
    }

    const precoTotal = quantidade * precoIndividual;
    const data = new Date().toLocaleDateString("pt-BR");

    const novoItem = {
        item,
        unidade,
        quantidade,
        precoIndividual,
        precoTotal,
        tipo,
        data
    };

    itens.push(novoItem);

    document.getElementById("listaItens").innerHTML += `
        <p>
            <b>${item}</b><br>
            Unidade: ${unidade}<br>
            Quantidade: ${quantidade}<br>
            Preço individual: R$ ${precoIndividual.toFixed(2)}<br>
            Preço total: R$ ${precoTotal.toFixed(2)}<br>
            Tipo: ${tipo}<br>
            Data: ${data}
        </p>
        <hr>
    `;

    document.getElementById("item").value = "";
    document.getElementById("unidade").value = "";
    document.getElementById("quantidade").value = "";
    document.getElementById("precoIndividual").value = "";
};

// SALVAR TODOS OS ITENS NO FIRESTORE
window.salvarTudo = async function() {
    if (itens.length === 0) {
        alert("Nenhum item adicionado!");
        return;
    }

    for (const item of itens) {
        // SALVA NA COLEÇÃO COMPRAS
        await addDoc(collection(db, "compras"), item);

        // CRIA LOTE NO ESTOQUE (MODELO 2)
        await addDoc(collection(db, "estoque"), {
            nome: item.item,
            tipo: item.tipo,
            unidade: item.unidade,
            quantidade: item.quantidade,
            custoUnitario: item.precoIndividual,
            custoTotal: item.precoTotal,
            data: item.data
        });
    }

    alert("Todas as compras foram registradas!");

    itens = [];
    document.getElementById("listaItens").innerHTML = "";

    carregarCompras();
};

// LISTAR COMPRAS
async function carregarCompras() {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    const dados = await getDocs(collection(db, "compras"));

    dados.forEach(docItem => {
        const c = docItem.data();
        const id = docItem.id;

        lista.innerHTML += `
            <p>
                <b>${c.item}</b><br>
                Tipo: ${c.tipo}<br>
                Unidade: ${c.unidade}<br>
                Quantidade: ${c.quantidade}<br>
                Preço individual: R$ ${c.precoIndividual.toFixed(2)}<br>
                Preço total: R$ ${c.precoTotal.toFixed(2)}<br>
                Data: ${c.data}<br><br>

                <button onclick="excluirCompra('${id}')">Excluir</button>
            </p>
            <hr>
        `;
    });
}

// EXCLUIR COMPRA
window.excluirCompra = async function(id) {
    await deleteDoc(doc(db, "compras", id));
    alert("Compra excluída!");
    carregarCompras();
};

carregarCompras();
</script>

</body>
</html>
