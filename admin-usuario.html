<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Administração de Usuários</title>

    <style>
        body {
            font-family: Arial;
            background: #f7f7f7;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .user-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 2px solid #4CAF50;
        }

        button {
            padding: 8px 12px;
            margin-right: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .promover {
            background: #2196F3;
            color: white;
        }

        .rebaixar {
            background: #FF9800;
            color: white;
        }

        .excluir {
            background: #F44336;
            color: white;
        }
    </style>
</head>
<body>

<h1>Administração de Usuários</h1>

<div id="lista"></div>

<script type="module">
import "./auth.js";
import { auth, db } from "./firebase.js";
import { 
    collection, getDocs, doc, updateDoc, deleteDoc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// GARANTIR QUE SOMENTE ADMIN ACESSA
import { getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

async function verificarPermissao() {
    const user = auth.currentUser;
    const userDoc = await getDoc(doc(db, "users", user.uid));

    if (userDoc.data().role !== "admin") {
        alert("Acesso negado! Somente administradores.");
        window.location.href = "index.html";
    }
}

verificarPermissao();

// LISTAR USUÁRIOS
async function carregarUsuarios() {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    const snap = await getDocs(collection(db, "users"));

    snap.forEach(docItem => {
        const u = docItem.data();
        const id = docItem.id;

        lista.innerHTML += `
            <div class="user-box">
                <b>Email:</b> ${u.email}<br>
                <b>Celular:</b> ${u.celular || "Não informado"}<br>
                <b>Tipo:</b> ${u.role}<br><br>

                ${u.role === "cliente" ? 
                    `<button class="promover" onclick="promover('${id}')">Promover para Admin</button>` :
                    `<button class="rebaixar" onclick="rebaixar('${id}')">Rebaixar para Cliente</button>`
                }

                <button class="excluir" onclick="excluir('${id}')">Excluir Usuário</button>
            </div>
        `;
    });
}

carregarUsuarios();

// PROMOVER CLIENTE → ADMIN
window.promover = async function(id) {
    await updateDoc(doc(db, "users", id), {
        role: "admin"
    });

    alert("Usuário promovido para administrador!");
    carregarUsuarios();
};

// REBAIXAR ADMIN → CLIENTE
window.rebaixar = async function(id) {
    await updateDoc(doc(db, "users", id), {
        role: "cliente"
    });

    alert("Usuário rebaixado para cliente!");
    carregarUsuarios();
};

// EXCLUIR USUÁRIO
window.excluir = async function(id) {
    if (!confirm("Tem certeza que deseja excluir este usuário?")) return;

    await deleteDoc(doc(db, "users", id));

    alert("Usuário excluído!");
    carregarUsuarios();
};
</script>

</body>
</html>
