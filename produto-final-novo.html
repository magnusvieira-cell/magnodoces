<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Novo Produto Final</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Novo Produto Final</h1>

<div class="card">
    <label>Nome</label>
    <input id="nome" type="text">

    <label>Descrição</label>
    <textarea id="descricao"></textarea>

    <label>Preço</label>
    <input id="preco" type="number" step="0.01">

    <label>Ingredientes (IDs separados por vírgula)</label>
    <input id="ingredientes" type="text">

    <label>Imagem do Produto</label>
    <input id="imagemArquivo" type="file" accept="image/*">

    <button onclick="salvar()">Salvar Produto</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
<script src="firebase.js"></script>

<script>
async function salvar() {
    const nome = document.getElementById("nome").value;
    const descricao = document.getElementById("descricao").value;
    const preco = Number(document.getElementById("preco").value);
    const ingredientes = document.getElementById("ingredientes").value.split(",");
    const arquivo = document.getElementById("imagemArquivo").files[0];

    if (!nome || !descricao || !preco || ingredientes.length === 0 || !arquivo) {
        alert("Preencha todos os campos e selecione uma imagem.");
        return;
    }

    // ===============================
    // 1. Enviar imagem ao Firebase Storage
    // ===============================
    const storageRef = firebase.storage().ref("produtos/" + arquivo.name);
    const upload = await storageRef.put(arquivo);
    const imagemURL = await upload.ref.getDownloadURL();

    // ===============================
    // 2. Salvar produto no Firestore
    // ===============================
    salvarProdutoFinal({
        nome,
        descricao,
        preco,
        ingredientes,
        imagem: imagemURL
    }).then(() => {
        alert("Produto salvo com sucesso!");
        window.location.href = "produtos-finais.html";
    });
}
</script>

</body>
</html>
